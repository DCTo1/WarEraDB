# WarEraDB — TimescaleDB convenience compose file.
#
# This is the manual/advanced alternative to the container that
# `python warera_gui.py --setup` creates automatically. It runs the exact
# same image with the same port, credentials and named volume:
#
#     docker compose up -d
#
# Then run the GUI or the pipeline scripts as usual (default database
# `tsdb`, password `postgres`, port 5432). To use a different published
# port or database name, override them, e.g.:
#
#     docker compose up -d -e POSTGRES_DB=tsdb   # (or edit this file)
#
# The named volume keeps the data when the container is recreated
# (`docker compose down` keeps it; `docker compose down -v` deletes it).

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    container_name: wareradb-timescaledb
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tsdb
    ports:
      - "5432:5432"
    volumes:
      - wareradb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tsdb"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  wareradb-data:
